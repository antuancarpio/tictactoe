<!DOCTYPE html>
<html lang="es">

                    </tr>
                    <tr>

                    </tr>

                        <td><input type="button" onclick="activo(this)"></td>
                    </tr>
                </table>
            </div>
        </div>

        <p id="ganador" class="ganador"></p>
        <button id="reiniciar" type="button" onclick="reiniciar()">Reiniciar</button>
    </main>
</body>
</html>
